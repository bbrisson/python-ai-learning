name: ai_learning
channels:
  - defaults
dependencies:
  - python=3.11
  - ipykernel
  - pip
  - pip:
      # Interface du laboratoire Ollama existant.
      - "streamlit>=1.59,<1.60"
      # Parcours applications IA modernes.
      - "pydantic>=2.13,<3"
      - "fastapi>=0.141,<0.142"
      - "uvicorn>=0.51,<0.52"
      - "outlines[ollama]>=1.3,<1.4"
      - "langchain>=1.3,<1.4"
      - "langchain-ollama>=1.1,<1.2"
      - "langgraph>=1.2,<1.3"
      # Tests du mini-projet FastAPI et des composants IA.
      - "httpx2>=2.10,<3"
      - "pytest>=9,<10"
