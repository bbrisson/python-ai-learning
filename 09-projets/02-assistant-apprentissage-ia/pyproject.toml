[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-assistant"
version = "0.1.0"
description = "Projet pédagogique Pydantic, FastAPI, Outlines, LangChain et LangGraph"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.51,<0.52",
    "outlines[ollama]>=1.3,<1.4",
    "langchain>=1.3,<1.4",
    "langchain-ollama>=1.1,<1.2",
    "langgraph>=1.2,<1.3",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.10,<3",
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
